[project]
name = "service-scout"
version = "0.1.0"
description = "Budget-governed research control plane — discovers web services, writes decisions to Notion"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Maxim" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "apprise>=1.8",
  "feedparser>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
service-scout = "service_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
